services:
  isaac-sim-default-play:
    profiles: ["default-play"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - TASK_ID=${TASK_ID:-g1_handover_teacher}
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
      - ./logs/${TASK_ID:-g1_handover_teacher}:/workspace/g1-handover-project/logs
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/src/tasks/play.py
      --task G1-Handover-v0
      --num_envs 1
      --checkpoint ${PLAYBACK_CHECKPOINT}
      --enable_cameras

  isaac-sim-train:
    profiles: ["train"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - TASK_ID=${TASK_ID:-g1_handover_base}
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
      # 【追加】ホスト側でS3と同期したlogsディレクトリをコンテナ内に共有
      - ./logs/${TASK_ID:-g1_handover_base}:/workspace/g1-handover-project/logs
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/src/train.py
      --task G1-Handover-v0
      --num_envs 512

  isaac-sim-visual-check:
    profiles: ["visual-check"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - TASK_ID=${TASK_ID:-g1_handover_base}
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
      # 【追加】ホスト側でS3と同期したlogsディレクトリをコンテナ内に共有
      - ./logs/${TASK_ID:-g1_handover_base}:/workspace/g1-handover-project/logs
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/src/tasks/visual_check.py
      --task G1-Handover-v0
      --num_envs 1
      --steps ${VISUAL_CHECK_STEPS:-7200}
      --enable_cameras

  isaac-sim-playback:
    profiles: ["playback"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - TASK_ID=${TASK_ID:-g1_handover_base}
      - PLAYBACK_CHECKPOINT=${PLAYBACK_CHECKPOINT}
      - PLAYBACK_MODE=${PLAYBACK_MODE:-policy}
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
      - ./logs/${TASK_ID:-g1_handover_base}:/workspace/g1-handover-project/logs
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/src/tasks/checkpoint_playback.py
      --task G1-Handover-v0
      --num_envs 1
      --checkpoint ${PLAYBACK_CHECKPOINT}
      --mode ${PLAYBACK_MODE:-policy}
      --loop
      --enable_cameras

  isaac-sim-playback-desktop:
    profiles: ["playback-desktop"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - TASK_ID=${TASK_ID:-g1_handover_base}
      - PLAYBACK_CHECKPOINT=${PLAYBACK_CHECKPOINT}
      - PLAYBACK_MODE=${PLAYBACK_MODE:-policy}
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=${XAUTHORITY:-/root/.Xauthority}
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
      - ./logs/${TASK_ID:-g1_handover_base}:/workspace/g1-handover-project/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/src/tasks/checkpoint_playback.py
      --task G1-Handover-v0
      --num_envs 1
      --checkpoint ${PLAYBACK_CHECKPOINT}
      --mode ${PLAYBACK_MODE:-policy}
      --loop
      --enable_cameras
      --kit_args "--/app/window/width=1600 --/app/window/height=900"

  isaac-sim-playback-dcv:
    profiles: ["playback-dcv"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - TASK_ID=${TASK_ID:-g1_handover_teacher}
      - PLAYBACK_CHECKPOINT=${PLAYBACK_CHECKPOINT}
      - PLAYBACK_MODE=${PLAYBACK_MODE:-policy}
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/root/.Xauthority
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __NV_PRIME_RENDER_OFFLOAD=1
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
      - ./logs/${TASK_ID:-g1_handover_teacher}:/workspace/g1-handover-project/logs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${DCV_XAUTHORITY:-/home/ubuntu/.Xauthority}:/root/.Xauthority:ro
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/src/tasks/checkpoint_playback.py
      --task G1-Handover-v0
      --num_envs 1
      --checkpoint ${PLAYBACK_CHECKPOINT}
      --mode ${PLAYBACK_MODE:-policy}
      --loop
      --enable_cameras
      --kit_args "--/app/window/enabled=true --/app/window/visible=true --/app/window/noWindowMode=false --/app/window/fullscreen=false --/app/window/alwaysOnTop=true --/app/window/width=1600 --/app/window/height=900 --/renderer/multiGpu/enabled=false"

  isaac-sim-kinematic:
    profiles: ["kinematic-replay"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - TASK_ID=${TASK_ID:-g1_handover_base}
      - MOTION_DIR=/workspace/g1-handover-project/data/motions/HandOver7
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/src/tasks/motion_replay.py
      --task G1-Handover-v0
      --num_envs 1
      --motion_dir /workspace/g1-handover-project/data/motions/HandOver7
      --fps 50
      --loop
      --enable_cameras

  isaac-sim-dcv-gui-check:
    profiles: ["dcv-gui-check"]
    image: nvcr.io/nvidia/isaac-sim:6.0.1
    container_name: isaac-sim-groot
    user: "0:0"
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/root/.Xauthority
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    volumes:
      - ../IsaacLab:/workspace/IsaacLab
      - .:/workspace/g1-handover-project
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${DCV_XAUTHORITY:-/home/ubuntu/.Xauthority}:/root/.Xauthority:ro
    entrypoint: ["/bin/bash", "/workspace/g1-handover-project/scripts/container_entrypoint.sh"]
    command: >
      /workspace/IsaacLab/isaaclab.sh -p /workspace/g1-handover-project/scripts/dcv_gui_popup.py
      --seconds ${DCV_GUI_SECONDS:-30}
      --kit_args "--/app/window/enabled=true --/app/window/visible=true --/app/window/noWindowMode=false --/app/window/fullscreen=false --/app/window/width=1600 --/app/window/height=900"